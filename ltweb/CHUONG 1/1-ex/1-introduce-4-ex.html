<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1-introduce-4-ex</title>
    <link rel="icon" href="#" />
    <style>
      form {
        margin: 0 auto;
        width: 400px;
      }

      table {
        text-align: center;
      }
      .title {
        font-size: 25px;
        font-weight: 700;
      }

      input {
        width: 300px;
        height: 50px;
        margin-bottom: 3px;
      }

      .blue-btn {
        background-color: #15c;
      }

      .green-btn {
        background-color: green;
      }

      .btn {
        color: white;
        border-radius: 5px;
        border: none;
        height: 35px;
      }
    </style>
  </head>
  <body>
    <form>
      <table>
        <tr>
          <td class="title" style="color: #15c; margin: 5px">
            Đăng nhập hệ thống
          </td>
        </tr>
        <tr>
          <td>
            <input type="text" placeholder="Tài khoản" />
          </td>
        </tr>
        <tr>
          <td>
            <input type="password" placeholder="Mật khẩu" />
          </td>
        </tr>
        <tr>
          <td><button class="blue-btn btn">Đăng nhập</button></td>
        </tr>
        <tr></tr>
        <tr>
          <td><a href="#">Quên mật khẩu</a></td>
        </tr>
        <tr>
          <td><button class="green-btn btn">Tạo tài khoản mới</button></td>
        </tr>
      </table>
    </form>
  </body>
</html>
